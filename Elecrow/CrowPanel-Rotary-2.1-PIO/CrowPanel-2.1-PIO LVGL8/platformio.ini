; PlatformIO Project Configuration File
; CrowPanel 2.1inch HMI ESP32 Rotary Display 480x480
; ESP32-S3-N16R8 - Xtensa LX7 dual-core @ 240MHz
; 512KB SRAM, 8MB OPI PSRAM, 16MB Flash

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Memory configuration for N16R8 (16MB Flash + 8MB OPI PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Custom partition scheme for 16MB flash
board_build.partitions = default_16MB.csv

; Build flags
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

; Upload settings
upload_speed = 921600

; Library dependencies
lib_deps =
    Wire
    SPI
