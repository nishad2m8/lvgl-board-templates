; PlatformIO Project Configuration
; Waveshare ESP32-S3 e-Paper 3.97" with LVGL 9.3.x
; Board: ESP32-S3-WROOM-1-N16R8 (16MB Flash, 8MB PSRAM)

[env:esp32-s3-epaper-397]
platform = espressif32
board = esp32-s3-epaper-397
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
framework = arduino

; PSRAM support
board_build.arduino.psram = enabled
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I include
    ; LVGL config
    ; -DLV_CONF_INCLUDE_SIMPLE
    ; AXP2101 power management chip
    -DXPOWERS_CHIP_AXP2101
    -DCONFIG_XPOWERS_ESP_IDF_NEW_API
    ; Suppress non-critical warnings
    -Wno-missing-field-initializers
    -Wno-unused-variable
    ; Optimizations
    -O2
    -DCORE_DEBUG_LEVEL=3
    -w

; Monitor
monitor_speed = 115200

; Upload
upload_speed = 460800

; Library dependencies
lib_deps =
    lvgl/lvgl@~9.3.0
    ; XPowersLib is bundled in lib/axpPower/src/

; Force deep dependency scanning so all lib/ folders are found
lib_ldf_mode = deep+

; Ignore the epaper_port library (uses wrong command set for this display)
lib_ignore = epaper_port

; Library compatibility
lib_compat_mode = off

; Custom board directory
board_dir = boards
