; PlatformIO Project Configuration File for Waveshare ESP32-S3-ePaper-1.54
;
; Board: Waveshare ESP32-S3-ePaper-1.54
; MCU: ESP32-S3 (Xtensa dual-core LX7, up to 240MHz)
; Memory: 512KB SRAM, 384KB ROM, with Flash and PSRAM
; Display: 1.54" e-Paper, 200x200 resolution
; Features: Wi-Fi, BLE, RTC (PCF85063), SHTC3 sensor, Audio codec, SD card
;
; Documentation: https://www.waveshare.com/wiki/ESP32-S3-ePaper-1.54

[env:esp32-s3-epaper-154]
platform = espressif32
board = esp32-s3-epaper-154
framework = arduino
board_dir = boards

; Board configuration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.psram_type = opi

; Partition scheme - use default 4MB with SPIFFS
; Adjust if your board has different flash size
board_build.partitions = default.csv

; Enable PSRAM (required for LVGL buffer allocation)
board_build.arduino.memory_type = qio_opi

; USB Configuration (ESP32-S3 native USB)
board_build.usb_mode = 1  ; Enable USB-OTG (hardware CDC/JTAG)
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags
build_flags =
    ; PSRAM configuration
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; ESP32-S3 specific
    -DESP32S3
    -DCORE_DEBUG_LEVEL=3

    ; LVGL configuration
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I lib

    ; Optimize for performance
    -O2 ; STANDARD optimization - good performance/size balance
    -w  ; Suppress warnings during build (remove if you want to see warnings)

    ; Memory optimization
    -DCONFIG_SPIRAM_CACHE_WORKAROUND
    -DCONFIG_SPIRAM_USE_MALLOC

; Required libraries
lib_deps =

lib_ldf_mode = deep+

; Extra build settings
; debug - Larger binary, includes debug symbols, easier debugging
; minimal - Quick compile times, basic optimization
; size - Prioritizes smallest possible firmware size
build_type = release ; Smallest binary, fastest execution, no debugging symbols

