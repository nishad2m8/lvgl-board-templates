; Nextion ONX3248G035 (ESP32-S3, 320x480 ST7796U, CST826 touch, PCF8574 IO expander)
; Board options mirror the Arduino IDE settings used by the factory examples:
; ESP32S3 Dev Module / 16MB flash / OPI PSRAM / 16M partition scheme

[env:nextion_onx3248g035]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; Pin the Arduino core
platform_packages =
	platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
upload_speed = 921600

build_flags =
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D NEXTION_3_5=1
	-D LV_CONF_SKIP
	-I include
	-D CORE_DEBUG_LEVEL=1

lib_deps =
	lvgl/lvgl@9.5.0
	moononournation/GFX Library for Arduino@1.5.7
	adafruit/Adafruit CST8XX Library@1.1.1
	adafruit/Adafruit PCF8574@1.1.2
	adafruit/Adafruit BusIO@1.17.4

lib_ldf_mode = deep+
